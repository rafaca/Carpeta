  <style>
    /* ================================================================
       matriximg — the /matrix/ "Quadrant" reactions deck, re-cut for
       fashion collections: every card is one look, a square image
       centred inside the graph, rated on Hate It/Love It x Boring/Bold.

       Card (381.5 × 382):
         grid box   350×350 @ (24, 22)   — blue mesh, hidden by default
         inner box  314×314 @ (42, 40)   — 1px #010693 border
         headline   x 59 (17px inside box), y 72.5 (32.5px below box top)
         count      x 41, y 360 — #3c19ad, below the box
         axes       #0e1db9, centred on the grid edges
         puck       12px #ff5900 core + 10px #0a1230 outside ring

       The card stays NAVY in both states — the grid is blue-on-navy.
       Fonts (Typekit): firelli-variable / questa-sans / panel.
       ================================================================ */

    :root {
      --q2-orange: #ff5900;
      --accent: #FF5900;   /* AA on the dark bg (6.0) */
      --link-red: #fc3b2c; /* AA on the dark bg (5.2) */
      --bg: #0B1020;
      --frame-rest: #0d2969;
      --grid-fine: #0d2969;  --grid-fine-o: 0.52;
      --grid-acc: #405be0;   --grid-acc-o: 0.7;
      --axis: #405be0;
      --headline: #fff;
      --dek: #fafaf7;
      --copy-hover: #1D3682;
      --count: #7D66FF;   /* lighter violet so the count reads on navy */
      --pct: #5871FF;
      --count-tag: #7D66FF;
      --axis-label: #1D3682;
      --bracket: #1D3682;
      --frame-line: #1D3682;
      --link-purple: #5B45A5;
      --pct-corner: #fff;   /* corner percentages read white on dark */
      --font-num: "code-saver", ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
      --prog-off: rgba(64, 91, 224, 0.55);
      --prog-on: #e4e9ff;
      --meta: #e4e9ff;
      --nav: #e4e9ff;
      --cap: #fff;
      --source: #fff;
      --link-hover: #FEF189;
      --btn-bg: #08112D;
      --btn-fg: #3C19AD;
      --btn-fg-hover: #4a67ff;
      --tag: #fff;
    }
    [data-theme="light"] {
      --bg: #ecf7fe;
      --accent: #C24300;   /* AA on the light bg (4.7) */
      --link-red: #D3220F; /* AA on the light bg (4.8) */
      --frame-rest: #95a4c0;
      --grid-fine: #95a5c1;  --grid-fine-o: 0.52;
      --grid-acc: #95a4c0;   --grid-acc-o: 1;
      --axis: #152865;
      --headline: #1d1f20;
      --dek: #1d1f20;
      --copy-hover: #8A91A6;
      --count: #3C19AD;
      --bracket: #95A5C1;
      --frame-line: #95A5C1;
      --pct-corner: #4056E8;   /* white vanishes on the pale bg — stay blue */
      --pct: #4056E8;
      --count-tag: #4056E8;
      --axis-label: #1042FF;
      --prog-off: rgba(64, 91, 224, 0.45);
      --prog-on: #152865;
      --meta: #6a6f73;
      --nav: #152865;
      --cap: #1d1f20;
      --source: #6a6f73;
      --link-hover: #111d5d;
      --btn-bg: #ffffff;
      --btn-fg: #5066f6;
      --btn-fg-hover: #111d5d;
      --tag: #000;
    }
    /* theme switch — fixed top-right, same place on every page */
    .q2-theme {
      position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); left: calc(16px + env(safe-area-inset-left, 0px)); z-index: 20;
      background: none; border: 0; padding: 6px;
      color: var(--nav); font-size: 20px; line-height: 1; cursor: pointer;
      opacity: 0.8; transition: opacity 0.25s ease, color 0.25s ease;
    }
    .q2-theme:hover { opacity: 1; }

    /* page fade-in */
    .q2-app { animation: q2-fadein 0.7s ease both; }
    @keyframes q2-fadein { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .q2-app { animation: none; } }

    /* the field breathes: each story tints --bg toward its quadrant
       colour, so the slow background fade cues that the deck moved */
    html { background: var(--bg); transition: background 1.2s ease; }
    body { background: var(--bg); color: var(--headline); margin: 0; transition: background 1.2s ease; -webkit-font-smoothing: antialiased; }

    .q2-app {
      /* 360px reserved above/below the square keeps the source line fully
         visible under the graph — 320 left it clipped on short windows */
      /* full browser width with 5px side margins (was 92%), still capped
         by height room and the 460px ceiling */
      --postw: min(calc(100% - 10px), calc(100vh - 360px), calc(100dvh - 360px), 460px);
      position: relative;
      max-width: 480px; margin: 0 auto; background: var(--bg);
      transition: background 1.2s ease;
      height: 100vh; height: 100dvh;
      display: flex; flex-direction: column; overflow: hidden;
    }
    /* prev / next story arrows */
    /* bottom pager: prev arrow · progress dashes · next arrow.
       Arrows are thin chevrons at the same stroke weight as the dashes. */
    .q2-pagerow {
      /* floats centred in the band between the source line and the
         window bottom, tracking the window-centred graph */
      position: fixed; left: 50%; z-index: 10;
      top: calc(75vh + var(--postw) / 4);
      top: calc(75dvh + var(--postw) / 4);
      transform: translate(-50%, -50%);
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: var(--postw); margin: 0;
      padding: 0; box-sizing: border-box;
    }
    .q2-pagenav {
      flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
      background: none; border: 0; padding: 4px; margin: 0;
      color: var(--nav); line-height: 0; cursor: pointer;
      transition: color 0.2s ease, opacity 0.2s ease;
    }
    .q2-pagenav:hover { color: var(--prog-on); }
    .q2-pagenav[disabled] { opacity: 0.2; cursor: default; }
    @media (hover: none) and (pointer: coarse) {
      /* pagination rides 100px higher on phones */
      .q2-below { margin-top: 5px; }
      /* phones reserve less vertical room so the square can reach the
         full window width (5px margins) */
      .q2-app { --postw: min(calc(100% - 10px), calc(100vh - 310px), calc(100dvh - 310px), 460px); }
    }

    /* looks progress — 123 cards are too many for story dashes, so one
       thin track fills with the deck position, next to a numeric counter */
    .q2-progress {
      position: relative; flex: 1 1 auto; height: 2px; border-radius: 1px;
      background: var(--prog-off); overflow: hidden;
    }
    .q2-progress i {
      position: absolute; inset: 0; display: block; border-radius: inherit;
      background: var(--prog-on);
      transform: scaleX(0); transform-origin: left center;
      transition: transform 0.3s ease;
    }
    .q2-counter {
      flex: 0 0 auto;
      font-family: var(--font-num), var(--font-body, "questa-sans"), monospace;
      font-size: 10px; letter-spacing: 0.08em; color: var(--nav);
    }

    /* ---- Utility strip: one row the width of the matrix — logo on the
       left, date on the right ---- */
    /* header lockup — logo centred with the date underneath */
    .q2-strip {
      padding-top: 20px; width: var(--postw); margin: 0 auto;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 6px; flex: 0 0 auto;
    }
    .q2-issue {
      font-family: var(--font-body, "questa-sans"), system-ui, sans-serif;
      font-weight: 400; font-size: 15px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--axis-label);
      margin: 0;
    }
    .q2-wordmark {
      display: block; width: 138px; height: 39px;
      background-color: #1042FF;
      -webkit-mask-image: url('/frequencies-mark.svg'); mask-image: url('/frequencies-mark.svg');
      -webkit-mask-size: contain; mask-size: contain;
      -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
      -webkit-mask-position: center; mask-position: center;
    }

    /* how-to line — grows to fill the space above the chart and centres
       itself in it; the matching .q2-tapspace below the card keeps the
       chart from being pushed to the bottom */
    .q2-taphint {
      /* centred in the band between the header lockup and the graph top */
      position: fixed; left: 0; right: 0;
      top: calc(90px + env(safe-area-inset-top, 0px));
      height: calc((100vh - var(--postw)) / 2 - 90px);
      height: calc((100dvh - var(--postw)) / 2 - 90px);
      display: flex; align-items: center; justify-content: center;
      margin: 0;
      font-family: var(--font-body, "questa-sans"), system-ui, sans-serif;
      font-weight: 400; font-size: 12px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--link-red);
      text-align: center;
      transition: opacity 0.35s ease;
    }
    .q2-tapspace { display: none; }
    /* gone for the rest of the visit after the first tap on any graph
       (the flex region stays, so nothing shifts) */
    .q2-hinted .q2-taphint { opacity: 0; }
    .q2-card.reacted .q2-taphint { visibility: hidden; }

    /* ---- Stories: cards stacked in place, crossfade between them ---- */
    .q2-stack {
      position: relative;
      flex: 1 1 auto; min-height: 0;
      overflow: hidden;
    }
    .q2-stack::-webkit-scrollbar { display: none; }

    .q2-card { cursor: pointer; }
    .q2-card.reacted { cursor: default; }   /* the vote is final */
    .q2-card {
      position: absolute; inset: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 12px;
      opacity: 0; visibility: hidden; pointer-events: none;
      transition: opacity 0.45s ease, visibility 0s linear 0.45s;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none; user-select: none;
    }
    .q2-card.active {
      opacity: 1; visibility: visible; pointer-events: auto;
      transition: opacity 0.45s ease;
    }

    /* The scene — the graph square, pinned to the exact centre of the
       browser window (both axes) on every viewport. An inline-size
       container so the copy can scale with the card (cqw). */
    .q2-scene {
      position: fixed;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      width: var(--postw);
      height: var(--postw);
      container-type: inline-size;
    }
    .q2-plate {
      position: absolute; inset: 0;
      touch-action: pan-y;   /* JS owns horizontal — tap to vote, swipe to change story */
      outline: none;
    }
    .q2-plate:focus-visible { outline: 2px solid var(--q2-blue); outline-offset: 3px; }

    /* Corner brackets — always visible; the only frame in the rest state.
       Thick arms 12.35% of each side, per the Figma GRAPH component. */
    svg.q2-brax {
      position: absolute; inset: 0; width: 100%; height: 100%;
      display: block; z-index: 2; pointer-events: none;
    }
    svg.q2-brax path { fill: none; stroke: var(--bracket); }

    /* The look — every collection image is a square centred inside the
       graph frame; the mesh (z2) and the crowd dots (z3) draw over it */
    .q2-look {
      width: 260px; width: clamp(150px, 62cqw, 300px);
      max-width: 100%; aspect-ratio: 1 / 1; height: auto;
      align-self: center;
      overflow: hidden;
      position: relative; background: #000;
    }
    .q2-look img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transition: filter 0.35s ease, opacity 0.35s ease;
    }
    /* navy duotone overlay for the dark-mode hover state: #001B70 recolours the
       grayscale image (via `color` blend) over black — a blue tint, not grey */
    .q2-look::after {
      content: ""; position: absolute; inset: 0; z-index: 1; pointer-events: none;
      background: #001B70; mix-blend-mode: color;
      opacity: 0; transition: opacity 0.35s ease;
    }
    /* hover/hold: light mode drops the image to B/W multiply; dark mode gets
       the navy duotone (#001B70 over black) instead of grey */
    .q2-card.on .q2-look img {
      filter: grayscale(1);
      mix-blend-mode: multiply;
      opacity: 0.5;
    }
    :root:not([data-theme="light"]) .q2-card.on .q2-look img {
      mix-blend-mode: normal;
      opacity: 1;
    }
    :root:not([data-theme="light"]) .q2-card.on .q2-look::after { opacity: 0.85; }
    /* light mode hover: a soft gray-blue (#8A91A6) duotone over white — the
       image dims to 60% and the overlay recolours it, not a hard B/W multiply */
    [data-theme="light"] .q2-look { background: #fff; }
    [data-theme="light"] .q2-card.on .q2-look img { mix-blend-mode: normal; opacity: 0.6; }
    [data-theme="light"] .q2-card.on .q2-look::after { background: #8A91A6; opacity: 0.49; }
    /* once voted the look stays on the board, dimmed right down so the
       crowd dots read over it — the :root-scoped rule outranks the .on
       hover rules above, so hovering after the vote keeps the dim */
    .q2-card.reacted .q2-look img { filter: grayscale(1); opacity: 0.22; }
    :root:not([data-theme="light"]) .q2-card.reacted .q2-look img {
      mix-blend-mode: normal; opacity: 0.22;
    }
    :root:not([data-theme="light"]) .q2-card.reacted .q2-look::after { opacity: 0.85; }
    [data-theme="light"] .q2-card.reacted .q2-look img { mix-blend-mode: normal; opacity: 0.3; }
    [data-theme="light"] .q2-card.reacted .q2-look::after { background: #8A91A6; opacity: 0.49; }

    /* Blue mesh — hidden by default, shown on hover/reaction */
    svg.q2-grid .g-fine { stroke: var(--grid-fine); stroke-opacity: var(--grid-fine-o); }
    svg.q2-grid .g-frame { stroke: var(--frame-line); }
    svg.q2-grid {
      position: absolute; inset: 0; width: 100%; height: 100%;
      display: block; z-index: 2;
      opacity: 0; transition: opacity 0.35s ease;
    }
    .q2-card.on svg.q2-grid, .q2-card.reacted svg.q2-grid { opacity: 1; }

    /* Results cloud — crowd reactions, revealed once you've rated */
    canvas.q2-field {
      position: absolute; inset: 0; width: 100%; height: 100%;
      z-index: 3; opacity: 0; transition: opacity 0.7s;
      pointer-events: none;
    }
    .q2-card.reacted canvas.q2-field { opacity: 1; }

    /* Quadrant percentages — corners of the chart, revealed with the results */
    .q2-pct {
      position: absolute; z-index: 5;
      font-family: var(--font-num), var(--font-body, "questa-sans"), monospace;
      font-weight: 700; font-size: 9px; letter-spacing: 0.05em; line-height: 1;
      color: var(--pct-corner, var(--pct));
      /* rounded outline: a ring of hard shadows dilates the glyphs with a disk,
         so joins stay curvy (text-stroke would miter-spike on sharp corners) */
      text-shadow: 2px 0px 0 var(--bg), 1.8px 0.8px 0 var(--bg), 1.4px 1.4px 0 var(--bg), 0.8px 1.8px 0 var(--bg), 0px 2px 0 var(--bg), -0.8px 1.8px 0 var(--bg), -1.4px 1.4px 0 var(--bg), -1.8px 0.8px 0 var(--bg), -2px 0px 0 var(--bg), -1.8px -0.8px 0 var(--bg), -1.4px -1.4px 0 var(--bg), -0.8px -1.8px 0 var(--bg), 0px -2px 0 var(--bg), 0.8px -1.8px 0 var(--bg), 1.4px -1.4px 0 var(--bg), 1.8px -0.8px 0 var(--bg);
      opacity: 0; transition: opacity 0.6s 0.2s;
      pointer-events: none;
    }
    .q2-card.reacted .q2-pct { opacity: 1; }
    /* equal visual gap to both frame lines: the frame sits 2.857% in,
       the number 8px further on each axis (line-height 1 keeps it true) */
    .q2-pct-tl { top: calc(2.857% + 8px);    left: calc(2.857% + 8px); }
    .q2-pct-tr { top: calc(2.857% + 8px);    right: calc(2.857% + 8px); }
    .q2-pct-bl { bottom: calc(2.857% + 8px); left: calc(2.857% + 8px); }
    .q2-pct-br { bottom: calc(2.857% + 8px); right: calc(2.857% + 8px); }

    /* Axis labels — Questa Black, centred on the grid edges; deep navy at
       rest, white when the grid is revealed (dark mode only) */
    .q2-axis {
      position: absolute; z-index: 5;
      font-family: var(--font-body, "questa-sans"), system-ui, sans-serif;
      font-weight: 900; font-size: 11px; letter-spacing: 0.218em;
      text-indent: 0.218em;            /* offset trailing letter-space so the word centres true */
      text-transform: uppercase; color: var(--axis-label, var(--axis));
      white-space: nowrap; pointer-events: none; line-height: 1;
      /* opaque plate behind the word — a clean rectangular gap in the
         frame and grid, fully non-translucent (per the Figma component) */
      background: var(--bg); padding: 2px 5px;
      opacity: 1;   /* fully opaque — any dimming would ghost the plate */
      transition: color 0.35s ease, background 1.2s ease;
    }
    :root:not([data-theme="light"]) .q2-card.on .q2-axis,
    :root:not([data-theme="light"]) .q2-card.reacted .q2-axis { color: #fff; }
    /* light mode: quiet bracket gray at rest, electric blue on reveal */
    [data-theme="light"] .q2-axis { color: #95A5C1; }
    [data-theme="light"] .q2-card.on .q2-axis,
    [data-theme="light"] .q2-card.reacted .q2-axis { color: #1042FF; }
    /* floated clear of the mesh, 8px outside each edge */
    .q2-axis-t { top: 2.857%;             left: 50%; transform: translate(-50%, -50%); }
    .q2-axis-b { top: 97.143%;            left: 50%; transform: translate(-50%, -50%); }
    .q2-axis-l { left: 2.857%;            top: 50%; transform: translate(-50%, -50%) rotate(-90deg); }
    .q2-axis-r { left: 97.143%;           top: 50%; transform: translate(-50%, -50%) rotate(-90deg); }

    /* Puck — 12px orange core, 10px navy outside ring (32px total).
       The ring melts into the navy card; it reads over photos. */
    .q2-puck {
      position: absolute; box-sizing: border-box;
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--q2-orange);
      border: 5px solid var(--bg);
      z-index: 6; transform: translate(-50%, -50%) scale(0); pointer-events: none;
    }
    /* headline beside the vote dot once resolved — opinions-board treatment */
    .q2-puck-tag {
      position: absolute; z-index: 6;
      transform: translate(24px, -50%);
      max-width: 40%;
      font-family: var(--font-body, "questa-sans"), system-ui, sans-serif;
      font-weight: 600; font-size: 11px; line-height: 1.25;
      color: var(--tag); text-align: left;
      text-shadow: 0 0 2px var(--bg), 0 0 3px var(--bg), 0 0 4px var(--bg), 0 0 5px var(--bg), 0 0 6px var(--bg), 0 0 7px var(--bg), 0 0 8px var(--bg), 0 0 8px var(--bg), 0 0 8px var(--bg), 0 0 8px var(--bg);
      opacity: 0; transition: opacity 0.4s ease 0.2s;
      pointer-events: none;
    }
    .q2-puck-tag.flip { transform: translate(calc(-100% - 24px), -50%); text-align: right; }
    .q2-card.reacted .q2-puck-tag { opacity: 1; }
    .q2-puck.show { animation: q2-pop 0.4s cubic-bezier(0.2, 1.6, 0.4, 1) forwards; }
    .q2-puck.drag { transform: translate(-50%, -50%) scale(1); }   /* live under the finger */
    .q2-hoverdot {
      position: absolute; left: 0; top: 0; z-index: 7;
      width: 7px; height: 7px; border-radius: 50%;
      background: #fc3b2c; transform: translate(-50%, -50%);
      box-shadow: 0 0 6px 2px rgba(252, 59, 44, 0.65), 0 0 14px 5px rgba(252, 59, 44, 0.35);
      opacity: 0; transition: opacity 0.15s ease; pointer-events: none;
    }
    .q2-hoverdot.show { opacity: 1; }
    /* live feeling word pinned to the centre of the graph while
       navigating — the feelings wheel laid over the quadrant: position
       picks the family, distance from centre the intensity */
    .q2-feel {
      position: absolute; left: 50%; top: 50%; z-index: 8; pointer-events: none;
      transform: translate(-50%, -50%);
      font-family: var(--font-body, "questa-sans"), system-ui, sans-serif;
      font-weight: 700; font-size: 11px; letter-spacing: 0.13em; text-indent: 0.13em;
      text-transform: uppercase; color: var(--link-red); white-space: nowrap;
      /* background-coloured outside stroke clears the grid around the
         letters (same knockout as the axis labels) */
      /* rounded outline: a ring of hard shadows dilates the glyphs with a disk,
         so joins stay curvy (text-stroke would miter-spike on sharp corners) */

      if (px > 0.98) px = 1.96 - px; else if (px < 0.02) px = 0.04 - px;
      if (py > 0.98) py = 1.96 - py; else if (py < 0.02) py = 0.04 - py;
      pts.push([Math.max(0.02, Math.min(0.98, px)), Math.max(0.02, Math.min(0.98, py))]);
    }
    return pts;
  }
  /* Quadrant palette, brightened for the navy field */
  var QC = { tl: [252, 90, 77], tr: [242, 166, 59], bl: [106, 160, 255], br: [53, 201, 176] };
  function blendColor(x, y) {
    var L = function (a, b, t) { return a + (b - a) * t; };
    var top = [0,1,2].map(function (i) { return L(QC.tl[i], QC.tr[i], x); });
    var bot = [0,1,2].map(function (i) { return L(QC.bl[i], QC.br[i], x); });
    return [0,1,2].map(function (i) { return Math.round(L(top[i], bot[i], y)); });
  }

  function initCard(card) {
    var plate = card.querySelector('.q2-plate');
    var photo = card.dataset.photo;
    var storyId = card.dataset.storyId;
    var v = parseFloat(card.dataset.moodV || '0.5');
    var e = parseFloat(card.dataset.moodE || '0.5');
    var polar = parseFloat(card.dataset.moodPolar || '0.5');

    plate.innerHTML =
      bracketSVG() +
      gridSVG() +
      '<canvas class="q2-field" aria-hidden="true"></canvas>' +
      '<span class="q2-pct q2-pct-tl" data-q="tl"></span>' +
      '<span class="q2-pct q2-pct-tr" data-q="tr"></span>' +
      '<span class="q2-pct q2-pct-bl" data-q="bl"></span>' +
      '<span class="q2-pct q2-pct-br" data-q="br"></span>' +
      '<span class="q2-axis q2-axis-t">Bold</span>' +
      '<span class="q2-axis q2-axis-b">Boring</span>' +
      '<span class="q2-axis q2-axis-l">Hate It</span>' +
      '<span class="q2-axis q2-axis-r">Love It</span>' +
      '<span class="q2-puck" aria-hidden="true"></span>' +
      '<span class="q2-hoverdot" aria-hidden="true"></span>' +
      '<span class="q2-feel" aria-hidden="true"></span>';
    var lookImg = card.querySelector('.q2-look img');
    if (lookImg) lookImg.onerror = function () {
      var bn = card.querySelector('.q2-look');
      if (bn) bn.parentNode.removeChild(bn);
    };

    var puck = plate.querySelector('.q2-puck');
    var canvas = plate.querySelector('.q2-field');
    var reacted = false;

    /* a small red glow that tracks the cursor while hovering to react,
       with the live feeling word for that spot beside it */
    var hoverDot = plate.querySelector('.q2-hoverdot');
    var feelEl = plate.querySelector('.q2-feel');
    function setFeel(cx, cy) {
      feelEl.textContent = feelingAt(cx, cy);
      feelEl.classList.add('show');
    }
    function hideFeel() { feelEl.classList.remove('show'); }
    plate.addEventListener('pointermove', function (ev) {
      if (ev.pointerType !== 'mouse' || reacted) { hoverDot.classList.remove('show'); hideFeel(); return; }
      var rect = plate.getBoundingClientRect();
      hoverDot.style.left = (ev.clientX - rect.left) + 'px';
      hoverDot.style.top = (ev.clientY - rect.top) + 'px';
      hoverDot.classList.add('show');
      setFeel((ev.clientX - rect.left) / rect.width, (ev.clientY - rect.top) / rect.height);
    });
    plate.addEventListener('pointerleave', function () { hoverDot.classList.remove('show'); hideFeel(); });

    function drawField(ux, uy) {
      var pts = crowd(storyId, v, e, polar);
      if (ux !== null) pts.push([ux, uy]);
      var dpr = window.devicePixelRatio || 1;
      var w = plate.offsetWidth, h = plate.offsetHeight;
      canvas.width = w * dpr; canvas.height = h * dpr;
      var ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);
      /* map unit coords into the grid frame (rect 10..340 of the 350
         viewBox), padded a step in from the border, so every dot sits
         clearly inside the graph */
      var F0 = 10 / 350, FS = 330 / 350, PAD = 0.03;
      /* four-colour palette from the design swatch, hashed per dot */
      var DOT_COLORS = ['rgba(106,38,181,0.85)', 'rgba(70,90,216,0.85)',
                        'rgba(143,28,216,0.85)', 'rgba(12,37,215,0.85)'];
      pts.forEach(function (pt, i) {
        var mx = F0 + (PAD + pt[0] * (1 - 2 * PAD)) * FS;
        var my = F0 + (PAD + pt[1] * (1 - 2 * PAD)) * FS;
        ctx.fillStyle = DOT_COLORS[(Math.imul(i + 1, 2654435761) >>> 0) % 4];
        ctx.beginPath();
        ctx.arc(mx * w, my * h, 1.2, 0, Math.PI * 2);
        ctx.fill();
      });

      var qs = { tl: 0, tr: 0, bl: 0, br: 0 };
      pts.forEach(function (pt) {
        var qx = pt[0] >= 0.5 ? 'r' : 'l';
        var qy = pt[1] <  0.5 ? 't' : 'b';
        qs[qy + qx]++;
      });
      var total = pts.length || 1;
      Object.keys(qs).forEach(function (q) {
        var el = plate.querySelector('.q2-pct-' + q);
        if (!el) return;
        el.textContent = Math.round(qs[q] / total * 100) + '%';
      });
    }

    function getCoords(evt) {
      var rect = plate.getBoundingClientRect();
      var cx = (evt.clientX - rect.left) / rect.width;
      var cy = (evt.clientY - rect.top)  / rect.height;
      return [Math.max(0.03, Math.min(0.97, cx)), Math.max(0.03, Math.min(0.97, cy))];
    }

    function place(px, py, silent) {
      if (reacted) return;                              /* one vote per story */
      puck.style.left = (px * 100) + '%';
      puck.style.top  = (py * 100) + '%';
      puck.classList.remove('show');
      void puck.offsetWidth;
      puck.classList.add('show');
      drawField(px, py);
      var tagEl = plate.querySelector('.q2-puck-tag');
      if (!tagEl) {
        tagEl = document.createElement('span');
        tagEl.className = 'q2-puck-tag';
        plate.appendChild(tagEl);
      }
      var hEl = card.querySelector('.q2-headline');
      tagEl.textContent = hEl ? hEl.textContent : '';
      tagEl.style.left = (px * 100) + '%';
      tagEl.style.top  = (py * 100) + '%';
      tagEl.classList.toggle('flip', px > 0.55);
      card.classList.add('reacted');
      reacted = true;
      hideFeel();
      hoverDot.classList.remove('show');
      try {
        var all = JSON.parse(localStorage.getItem('freqz-matriximg-votes') || '{}');
        all[storyId] = [px, py];
        localStorage.setItem('freqz-matriximg-votes', JSON.stringify(all));
      } catch (e) {}
      if (!silent) startAuto();   /* fresh vote — story-style auto-advance */
    }

    /* Desktop hover previews the grid; click places the puck.
       Touch: a tap flips and places in one gesture. */
    card.addEventListener('pointerenter', function (ev) { if (ev.pointerType === 'mouse') card.classList.add('on'); });
    card.addEventListener('pointerleave', function (ev) { if (ev.pointerType === 'mouse') card.classList.remove('on'); });

    /* Touch: press-and-hold reveals the graph AND the dot under the
       finger; dragging draws it through the chart, release commits the
       vote where it lands. A quick tap still places immediately;
       dragging without holding scrolls as normal. */
    var pStart = null, holdTimer = null, holdActive = false, holdPid = null;
    function movePuckTo(ev) {
      var c = getCoords(ev);
      puck.style.left = (c[0] * 100) + '%';
      puck.style.top  = (c[1] * 100) + '%';
      return c;
    }
    plate.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
    plate.addEventListener('pointerdown', function (ev) {
      pStart = { x: ev.clientX, y: ev.clientY, ex: ev.clientX, ey: ev.clientY, t: Date.now() };
      holdActive = false;
      if (ev.pointerType !== 'mouse') {
        holdPid = ev.pointerId;
        clearTimeout(holdTimer);
        holdTimer = setTimeout(function () {
          holdActive = true;
          card.classList.add('on');
          if (!reacted) {
            var hc = movePuckTo({ clientX: pStart.ex, clientY: pStart.ey });
            setFeel(hc[0], hc[1]);
            puck.classList.add('drag');
          }
          try { plate.setPointerCapture(holdPid); } catch (e) {}
        }, 260);
      }
    });
    plate.addEventListener('touchmove', function (ev) {
      if (holdActive) ev.preventDefault();              /* no page scroll while drawing */
    }, { passive: false });
    plate.addEventListener('pointermove', function (ev) {
      if (holdActive) {
        /* once the hold is live you are voting — the drag is never
           reinterpreted as a story swipe, whatever direction it takes */
        if (!reacted) {                                 /* the dot follows the finger */
          var fc = movePuckTo(ev);
          setFeel(fc[0], fc[1]);
        }
        return;
      }
      if (!pStart) return;
      pStart.ex = ev.clientX; pStart.ey = ev.clientY;
      var dx = ev.clientX - pStart.x, dy = ev.clientY - pStart.y;
      if (Math.sqrt(dx * dx + dy * dy) > 10) clearTimeout(holdTimer);  /* scrolling */
    });
    plate.addEventListener('pointerup', function (ev) {
      clearTimeout(holdTimer);
      if (!pStart) return;
      var dx = ev.clientX - pStart.x, dy = ev.clientY - pStart.y;
      var dist = Math.sqrt(dx * dx + dy * dy);
      var dt = Date.now() - (pStart.t || 0);
      pStart = null;
      var c = getCoords(ev);
      if (holdActive) {
        puck.classList.remove('drag');
        if (!reacted) place(c[0], c[1]);                /* release commits the drawn spot */
        card.classList.remove('on');                    /* close the preview → results show */
        holdActive = false;
        return;
      }
      /* touch: a story swipe must be a real flick — fast, clearly
         horizontal, and a decent distance — so a sloppy tap or a slow
         drag on the graph never changes the story by accident */
      if (ev.pointerType !== 'mouse' && dt < 350 && Math.abs(dx) > 60 && Math.abs(dx) > 1.5 * Math.abs(dy)) {
        nav(dx < 0 ? 1 : -1);
        card.classList.remove('on');
        return;
      }
      if (dist > 10) return;                            /* drag/scroll, not a tap */
      place(c[0], c[1]);
      if (ev.pointerType !== 'mouse') card.classList.remove('on');
    });
    plate.addEventListener('pointercancel', function () {
      clearTimeout(holdTimer);
      pStart = null;
      puck.classList.remove('drag');
      hideFeel();
      if (holdActive && !reacted) card.classList.remove('on');
      holdActive = false;
    });

    var kx = 0.5, ky = 0.5;
    plate.addEventListener('keydown', function (ev) {
      if (reacted) return;              /* vote is final — let keys bubble */
      var step = 0.1;
      if (ev.key === 'ArrowLeft')  { kx = Math.max(0.03, kx - step); ev.preventDefault(); }
      if (ev.key === 'ArrowRight') { kx = Math.min(0.97, kx + step); ev.preventDefault(); }
      if (ev.key === 'ArrowUp')    { ky = Math.max(0.03, ky - step); ev.preventDefault(); }
      if (ev.key === 'ArrowDown')  { ky = Math.min(0.97, ky + step); ev.preventDefault(); }
      if (ev.key === 'Enter' || ev.key === ' ') { place(kx, ky); ev.preventDefault(); }
      if (ev.key === 'Escape') { card.classList.remove('on'); }
      if (ev.key === 'Tab') { card.classList.remove('on'); }
    });

    /* a vote is final — restore it across reloads (no auto-advance).
       TESTING: restore is off so a reload allows voting again on every
       story; flip REVOTE_TESTING to false to restore one-vote-per-story. */
    var REVOTE_TESTING = true;
    try {
      if (!REVOTE_TESTING) {
        var saved = JSON.parse(localStorage.getItem('freqz-matriximg-votes') || '{}')[storyId];
        if (saved) place(saved[0], saved[1], true);
      }
    } catch (e) {}

    /* deep-linked results view — everyone's dots without casting a vote;
       the story's headline labels the crowd at its centre */
    card.showResults = function () {
      if (reacted) return;                    /* a real vote already shows it */
      reacted = true;
      card.classList.add('reacted');
      hideFeel();
      drawField(null, null);
      var tagEl = plate.querySelector('.q2-puck-tag');
      if (!tagEl) {
        tagEl = document.createElement('span');
        tagEl.className = 'q2-puck-tag';
        plate.appendChild(tagEl);
      }
      var hEl = card.querySelector('.q2-headline');
      tagEl.textContent = hEl ? hEl.textContent : '';
      tagEl.style.left = (v * 100) + '%';
      tagEl.style.top  = (e * 100) + '%';
      tagEl.classList.toggle('flip', v > 0.55);
    };
  }

  var themeBtn = document.getElementById('theme-toggle');
  function syncThemeIcon() {
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    themeBtn.innerHTML = light ? '<i class="ri-moon-line"></i>' : '<i class="ri-sun-line"></i>';
  }
  themeBtn.addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('freqz-theme', next); } catch (e) {}
    syncThemeIcon();
    if (typeof tintBg === 'function') tintBg();   /* re-derive for the new theme */
  });
  syncThemeIcon();

  document.querySelectorAll('.q2-card').forEach(initCard);

  /* looks progress — one thin track that fills with the deck position */
  var track = document.querySelector('.q2-stack');
  var cards = Array.prototype.slice.call(track.querySelectorAll('.q2-card'));
  var progFill = document.getElementById('prog-fill');
  var progCount = document.getElementById('prog-count');
  var navPrev = document.getElementById('nav-prev');
  var navNext = document.getElementById('nav-next');
  var idx = 0;
  function syncProgress() {
    if (progFill) progFill.style.transform = 'scaleX(' + ((idx + 1) / (cards.length || 1)) + ')';
    if (progCount) progCount.textContent = (idx + 1) + ' / ' + cards.length;
    navPrev.disabled = idx <= 0;
    /* the deck loops — the last "next" carries back to the first look */
    navNext.disabled = false;
    navNext.setAttribute('aria-label', idx >= cards.length - 1 ? 'Back to the first look' : 'Next look');
  }
  /* Instagram-style rhythm: every look holds for 3s and the deck moves
     on by itself, looping at the end. Holding a graph — or hovering it
     with a mouse — pauses the clock; releasing resumes the remaining
     time. A fresh vote restarts the 3s so the results get a full beat. */
  var AUTO_MS = 3000;
  var autoTimer = null, autoDeadline = 0, autoRemain = 0, autoPaused = false;
  var autoOff = false;   /* arriving via a #look= deep link turns the rhythm off */
  function clearAuto() {
    clearTimeout(autoTimer); autoTimer = null; autoPaused = false;
  }
  function startAuto(ms) {
    if (autoOff) { clearAuto(); return; }
    ms = ms || AUTO_MS;
    clearAuto();
    autoRemain = ms;
    autoDeadline = Date.now() + ms;
    autoTimer = setTimeout(function () { nav(1); }, ms);
  }
  function pauseAuto() {
    if (autoTimer === null || autoPaused) return;
    autoPaused = true;
    autoRemain = Math.max(200, autoDeadline - Date.now());
    clearTimeout(autoTimer); autoTimer = null;
  }
  function resumeAuto() {
    if (!autoPaused) return;
    autoPaused = false;
    autoDeadline = Date.now() + autoRemain;
    autoTimer = setTimeout(function () { nav(1); }, autoRemain);
  }
  /* the background cycles through the tint swatches — one per story,
     so moving through the deck reads as the room slowly changing mood */
  var BG_TINTS = ['#0B1020', '#171026', '#0A1029', '#0F1523', '#10123E', '#0E1626'];
  function tintBg() {
    var c = cards[idx];
    if (!c) return;
    var light = document.documentElement.getAttribute('data-theme') === 'light';
    if (!light) {
      document.documentElement.style.setProperty('--bg', BG_TINTS[idx % BG_TINTS.length]);
      return;
    }
    /* light theme: gentle computed lean toward the story's quadrant */
    var base = [236, 247, 254];
    var q = blendColor(parseFloat(c.dataset.moodV || '0.5'), parseFloat(c.dataset.moodE || '0.5'));
    var m = [0, 1, 2].map(function (i) { return Math.round(base[i] + (q[i] - base[i]) * 0.06); });
    document.documentElement.style.setProperty('--bg', 'rgb(' + m.join(',') + ')');
  }
  /* lazy image hydration — a card's <img> gets its src only when the
     deck is about to reach it, so 123 remote images never download in
     one burst on page load */
  function hydrate(k) {
    var c = cards[k];
    if (!c) return;
    var im = c.querySelector('.q2-look img[data-src]');
    if (im) { im.src = im.getAttribute('data-src'); im.removeAttribute('data-src'); }
  }
  /* crossfade to look i — cards are stacked, no horizontal slide */
  function show(i) {
    i = Math.max(0, Math.min(cards.length - 1, i));
    idx = i;
    cards.forEach(function (c, k) { c.classList.toggle('active', k === i); });
    [i - 1, i, i + 1, i + 2].forEach(hydrate);
    syncProgress();
    tintBg();
    startAuto(AUTO_MS);
  }
  function nav(dir) {
    if (dir > 0 && idx >= cards.length - 1) { show(0); return; }
    show(idx + dir);
  }
  navPrev.addEventListener('click', function () { nav(-1); });
  navNext.addEventListener('click', function () { nav(1); });

  /* tap-and-hold (any pointer) or mouse hover pauses the story timer */
  track.addEventListener('pointerdown', function (ev) {
    if (ev.target.closest && ev.target.closest('.q2-plate')) pauseAuto();
  });
  document.addEventListener('pointerup', resumeAuto);
  document.addEventListener('pointercancel', resumeAuto);
  cards.forEach(function (c) {
    c.addEventListener('pointerenter', function (ev) { if (ev.pointerType === 'mouse') pauseAuto(); });
    c.addEventListener('pointerleave', function (ev) { if (ev.pointerType === 'mouse') resumeAuto(); });
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) pauseAuto(); else resumeAuto();
  });

  /* the how-to hint leaves after the first tap on any graph */
  track.addEventListener('pointerdown', function hintOnce(ev) {
    if (!ev.target.closest || !ev.target.closest('.q2-plate')) return;
    document.body.classList.add('q2-hinted');
    track.removeEventListener('pointerdown', hintOnce);
  });

  window.addEventListener('resize', syncProgress);

  /* deep link: /matriximg/#look=<id> opens that look's chart in the
     general results view — everyone's dots */
  function openFromHash() {
    var m = location.hash.match(/^#look=(.+)$/);
    if (!m) return false;
    /* coming from the opinions board to read one story — no auto-cycling */
    autoOff = true;
    clearAuto();
    var id = decodeURIComponent(m[1]);
    for (var k = 0; k < cards.length; k++) {
      if (cards[k].dataset.storyId === id) {
        show(k);
        if (cards[k].showResults) cards[k].showResults();
        return true;
      }
    }
    return false;
  }
  window.addEventListener('hashchange', openFromHash);
  if (!openFromHash()) show(0);

  /* arrow keys page through the looks */
  document.addEventListener('keydown', function (ev) {
    var t = ev.target;
    var isPlate = t && t.classList && t.classList.contains('q2-plate');
    if (t !== document.body && !isPlate) return;
    if (isPlate) {
      var c = t.closest('.q2-card');
      if (!c || !c.classList.contains('reacted')) return;  /* still voting by keyboard */
    }
    if (ev.key === 'ArrowRight') { nav(1);  ev.preventDefault(); }
    if (ev.key === 'ArrowLeft')  { nav(-1); ev.preventDefault(); }
  });
})();
</script>
