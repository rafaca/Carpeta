name: Deploy to Dreamhost

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dreamhost
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='figma-plugin' \
            --exclude='notion-to-creators.py' \
            --exclude='scan-photos.py' \
            --exclude='_site' \
            --exclude='CNAME' \
            ./ _site/

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
          HOST: ${{ secrets.DREAMHOST_HOST }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via rsync over SSH
        env:
          USER: ${{ secrets.DREAMHOST_USER }}
          HOST: ${{ secrets.DREAMHOST_HOST }}
          REMOTE_PATH: ${{ secrets.DREAMHOST_PATH }}
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            _site/ "$USER@$HOST:$REMOTE_PATH"
