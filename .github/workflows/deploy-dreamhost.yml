name: Deploy to Dreamhost

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-dreamhost
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage site files
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='figma-plugin' \
            --exclude='notion-to-creators.py' \
            --exclude='scan-photos.py' \
            --exclude='_site' \
            --exclude='CNAME' \
            ./ _site/

      - name: Deploy via SFTP
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.DREAMHOST_HOST }}
          REMOTE_USER: ${{ secrets.DREAMHOST_USER }}
          REMOTE_PORT: 22
          SOURCE: "_site/"
          TARGET: ${{ secrets.DREAMHOST_PATH }}
          ARGS: "-rltgoDzvO --delete"
