name: Deploy staging.thosewhoplay.com

on:
  push:
    branches:
      - claude/redesign-website-iubYk
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.thosewhoplay.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Write IP allowlist .htaccess
        env:
          STAGING_ALLOWED_IP: ${{ secrets.STAGING_ALLOWED_IP }}
        run: |
          if [ -n "$STAGING_ALLOWED_IP" ]; then
            ips=$(echo "$STAGING_ALLOWED_IP" | tr ',' ' ')
            cat > out/.htaccess <<EOF
          # Staging IP allowlist — managed by .github/workflows/deploy-staging.yml
          Require ip $ips
          EOF
            echo "Wrote out/.htaccess restricting access to: $ips"
          else
            echo "STAGING_ALLOWED_IP not set; deploying without IP restriction"
          fi

      - name: Configure SSH
        env:
          DREAMHOST_SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
          DREAMHOST_SSH_HOST: ${{ secrets.DREAMHOST_SSH_HOST }}
          DREAMHOST_SSH_PORT: ${{ secrets.DREAMHOST_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DREAMHOST_SSH_KEY" > ~/.ssh/dreamhost
          chmod 600 ~/.ssh/dreamhost
          PORT="${DREAMHOST_SSH_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$DREAMHOST_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via rsync
        env:
          DREAMHOST_SSH_HOST: ${{ secrets.DREAMHOST_SSH_HOST }}
          DREAMHOST_SSH_USER: ${{ secrets.DREAMHOST_SSH_USER }}
          DREAMHOST_SSH_PORT: ${{ secrets.DREAMHOST_SSH_PORT }}
          DREAMHOST_DEPLOY_PATH: ${{ secrets.DREAMHOST_DEPLOY_PATH }}
        run: |
          PORT="${DREAMHOST_SSH_PORT:-22}"
          rsync -avz --delete \
            --exclude='.well-known' \
            -e "ssh -i ~/.ssh/dreamhost -p $PORT -o StrictHostKeyChecking=yes" \
            ./out/ \
            "$DREAMHOST_SSH_USER@$DREAMHOST_SSH_HOST:$DREAMHOST_DEPLOY_PATH"
