name: Deploy thosewhoplay.com (production)

# Manual ship button: mirrors the same static site that dev.thosewhoplay.com
# serves into the production docroot. Deliberately additive — no --delete, and
# WordPress files already living there are left untouched (our index.html takes
# precedence over index.php; remove the mirrored files to roll back).

# Ship = push a change to this file (bump the counter below), or dispatch
# manually once the workflow reaches the default branch.
# ship: 18 — resilient deploy verification (slow Dreamhost caused false failures)

on:
  push:
    branches:
      - claude/redesign-website-iubYk
    paths:
      - .github/workflows/deploy-production.yml
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://thosewhoplay.com

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DREAMHOST_SSH_KEY: ${{ secrets.DREAMHOST_SSH_KEY }}
          DREAMHOST_SSH_HOST: ${{ secrets.DREAMHOST_SSH_HOST }}
          DREAMHOST_SSH_PORT: ${{ secrets.DREAMHOST_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DREAMHOST_SSH_KEY" > ~/.ssh/dreamhost
          chmod 600 ~/.ssh/dreamhost
          PORT="${DREAMHOST_SSH_PORT:-22}"
          # Dreamhost SSH is intermittently slow from GitHub runners; retry
          # the keyscan instead of dying on the first 5s timeout.
          for i in 1 2 3 4 5; do
            ssh-keyscan -T 15 -p "$PORT" -H "$DREAMHOST_SSH_HOST" >> ~/.ssh/known_hosts && break
            echo "ssh-keyscan attempt $i failed; retrying in $((i*5))s"
            sleep $((i*5))
          done
          grep -q . ~/.ssh/known_hosts || { echo "ssh-keyscan never reached $DREAMHOST_SSH_HOST"; exit 1; }

      - name: Preflight — docroot exists, archive any current index.html
        env:
          DREAMHOST_SSH_HOST: ${{ secrets.DREAMHOST_SSH_HOST }}
          DREAMHOST_SSH_USER: ${{ secrets.DREAMHOST_SSH_USER }}
          DREAMHOST_SSH_PORT: ${{ secrets.DREAMHOST_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${DREAMHOST_SSH_PORT:-22}"
          ssh -i ~/.ssh/dreamhost -p "$PORT" -o StrictHostKeyChecking=yes \
            "$DREAMHOST_SSH_USER@$DREAMHOST_SSH_HOST" '
              test -d ~/thosewhoplay.com || { echo "~/thosewhoplay.com does not exist on this server — is production hosted under this SSH user?"; exit 1; }
              cd ~/thosewhoplay.com
              if [ -f index.html ]; then
                cp index.html "archive-index-$(date +%Y%m%d-%H%M%S).html"
                echo "Archived the existing index.html"
              fi
            '

      - name: Mirror the static site (additive; WordPress left in place)
        env:
          DREAMHOST_SSH_HOST: ${{ secrets.DREAMHOST_SSH_HOST }}
          DREAMHOST_SSH_USER: ${{ secrets.DREAMHOST_SSH_USER }}
          DREAMHOST_SSH_PORT: ${{ secrets.DREAMHOST_SSH_PORT }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          PORT="${DREAMHOST_SSH_PORT:-22}"
          files=(public/*.html)
          echo "Shipping pages: ${files[*]}"
          scp -i ~/.ssh/dreamhost -P "$PORT" -o StrictHostKeyChecking=yes \
            "${files[@]}" \
            "$DREAMHOST_SSH_USER@$DREAMHOST_SSH_HOST:~/thosewhoplay.com/"
          # rsync with trailing slashes updates directories in place;
          # scp -r nested them (assets/assets) on re-deploys
          for d in assets projects research; do
            if [ -d "public/$d" ]; then
              rsync -az \
                -e "ssh -i ~/.ssh/dreamhost -p $PORT -o StrictHostKeyChecking=yes" \
                "public/$d/" \
                "$DREAMHOST_SSH_USER@$DREAMHOST_SSH_HOST:~/thosewhoplay.com/$d/"
            fi
          done
          # clean up any nested copies earlier scp deploys left behind
          ssh -i ~/.ssh/dreamhost -p "$PORT" -o StrictHostKeyChecking=yes \
            "$DREAMHOST_SSH_USER@$DREAMHOST_SSH_HOST" \
            'rm -rf ~/thosewhoplay.com/assets/assets ~/thosewhoplay.com/projects/projects ~/thosewhoplay.com/research/research'

      - name: Publish the homepage as the production index
        env:
          DREAMHOST_SSH_HOST: ${{ secrets.DREAMHOST_SSH_HOST }}
          DREAMHOST_SSH_USER: ${{ secrets.DREAMHOST_SSH_USER }}
          DREAMHOST_SSH_PORT: ${{ secrets.DREAMHOST_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${DREAMHOST_SSH_PORT:-22}"
          scp -i ~/.ssh/dreamhost -P "$PORT" -o StrictHostKeyChecking=yes \
            public/twp-homepage.html \
            "$DREAMHOST_SSH_USER@$DREAMHOST_SSH_HOST:~/thosewhoplay.com/index.html"

      - name: Ensure browsers revalidate HTML (assets stay cached via ?v=)
        env:
          DREAMHOST_SSH_HOST: ${{ secrets.DREAMHOST_SSH_HOST }}
          DREAMHOST_SSH_USER: ${{ secrets.DREAMHOST_SSH_USER }}
          DREAMHOST_SSH_PORT: ${{ secrets.DREAMHOST_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${DREAMHOST_SSH_PORT:-22}"
          ssh -i ~/.ssh/dreamhost -p "$PORT" -o StrictHostKeyChecking=yes \
            "$DREAMHOST_SSH_USER@$DREAMHOST_SSH_HOST" 'bash -s' <<'REMOTE'
          cd ~/thosewhoplay.com
          if ! grep -q "TWP html no-cache" .htaccess 2>/dev/null; then
            cat >> .htaccess <<'HT'

          # TWP html no-cache — pages revalidate on every visit so deploys show
          # immediately; fingerprinted assets (?v=) keep long-lived caching
          <IfModule mod_headers.c>
            <FilesMatch "\.html$">
              Header set Cache-Control "no-cache, must-revalidate"
            </FilesMatch>
          </IfModule>
          HT
            echo "added html no-cache block"
          else
            echo "html no-cache block already present"
          fi
          REMOTE

      - name: Verify the live homepage (fix DirectoryIndex if WordPress still wins)
        env:
          DREAMHOST_SSH_HOST: ${{ secrets.DREAMHOST_SSH_HOST }}
          DREAMHOST_SSH_USER: ${{ secrets.DREAMHOST_SSH_USER }}
          DREAMHOST_SSH_PORT: ${{ secrets.DREAMHOST_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${DREAMHOST_SSH_PORT:-22}"
          # Fetch first, test second: piping curl into grep under pipefail
          # turns a slow/timed-out download into a false "not deployed"
          # (Dreamhost gets sluggish, and a truncated body fails the grep).
          check() {
            local body
            body=$(curl -sL --max-time 60 --retry 4 --retry-delay 5 --retry-all-errors \
                     https://thosewhoplay.com/ 2>/dev/null) || return 1
            echo "fetched ${#body} bytes" >&2
            [ ${#body} -gt 2000 ] && printf '%s' "$body" | grep -q "roaring world"
          }
          if check; then
            echo "thosewhoplay.com serves the new homepage"
          else
            echo "=== homepage check failed — gathering evidence ==="
            curl -sIL --max-time 30 https://thosewhoplay.com/ | head -40 || true
            echo "=== what / actually returns (first 600 bytes) ==="
            curl -sL --max-time 30 https://thosewhoplay.com/ | head -c 600 || true; echo
            ssh -i ~/.ssh/dreamhost -p "$PORT" -o StrictHostKeyChecking=yes \
              "$DREAMHOST_SSH_USER@$DREAMHOST_SSH_HOST" '
                cd ~/thosewhoplay.com
                echo "=== index files on disk ==="
                ls -la index.* 2>/dev/null || echo "NO index files"
                echo "=== index.html head ==="
                head -c 300 index.html 2>/dev/null; echo
                echo "=== .htaccess (last 60 lines) ==="
                tail -60 .htaccess 2>/dev/null || echo "NO .htaccess"
              '
            echo "=== appending DirectoryIndex (once) and retrying ==="
            ssh -i ~/.ssh/dreamhost -p "$PORT" -o StrictHostKeyChecking=yes \
              "$DREAMHOST_SSH_USER@$DREAMHOST_SSH_HOST" '
                cd ~/thosewhoplay.com
                grep -q "TWP static site serves the index" .htaccess 2>/dev/null || {
                  [ -f .htaccess ] && cp .htaccess ".htaccess.bak-pre-twp" || true
                  printf "\n# TWP static site serves the index (WordPress remains for other routes)\nDirectoryIndex index.html index.php\n" >> .htaccess
                }
              '
            sleep 5
            check && echo "Fixed — new homepage is live" || { echo "Homepage still not serving the new site — see evidence above"; exit 1; }
          fi
          for p in projects.html store.html research.html about.html book.html; do
            curl -sL --max-time 30 -o /dev/null -w "%{http_code} /$p\n" "https://thosewhoplay.com/$p"
          done

      - name: Diagnostics — what the browser actually receives
        run: |
          set -uo pipefail
          echo "=== stylesheet status ==="
          curl -sL --max-time 30 -o /tmp/twp.css -w "%{http_code} %{size_download} bytes\n" https://thosewhoplay.com/assets/css/twp.css
          echo "=== foot-wordmark rules in served CSS ==="
          grep -A4 "foot-wordmark" /tmp/twp.css || echo "!! no foot-wordmark rules in served CSS"
          echo "=== footer markup in served HTML ==="
          curl -sL --max-time 30 https://thosewhoplay.com/ -o /tmp/home.html
          grep -B1 -A3 "foot-wordmark" /tmp/home.html || echo "!! no foot-wordmark in served HTML"
          echo "=== dancers mount in served HTML ==="
          grep -A12 "BubbleDancers.mount" /tmp/home.html || echo "!! no mount call found"
          echo "=== wordmark asset ==="
          curl -sL --max-time 30 -o /tmp/wm.svg -w "%{http_code} %{size_download} bytes\n" https://thosewhoplay.com/assets/logo-twp-wordmark.svg
          head -c 200 /tmp/wm.svg; echo
          echo "=== engine version check (0 = old engine, no figureColour) ==="
          curl -sL --max-time 30 https://thosewhoplay.com/assets/js/dancers-embed.js | grep -c "figureColour" || true
