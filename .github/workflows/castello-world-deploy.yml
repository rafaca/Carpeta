name: Deploy castello.world

# Uploads castello-world/ to the castello.world web directory on DreamHost
# whenever it changes on main. Never deletes server-side files (no --delete),
# so anything that exists only on the server is left untouched.

on:
  push:
    branches: [main]
    paths:
      - 'castello-world/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.CASTELLO_DREAMHOST_SSH_KEY }}
          RAW_HOST: ${{ secrets.CASTELLO_DREAMHOST_HOST }}
        run: |
          mkdir -p ~/.ssh
          # Strip stray whitespace/CR that panel copy-paste tends to add
          HOST="$(printf '%s' "$RAW_HOST" | tr -d '[:space:]')"
          printf '%s\n' "$SSH_KEY" | sed 's/\r$//' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          echo "DH_HOST=$HOST" >> "$GITHUB_ENV"

      - name: Rsync site up
        env:
          RAW_USER: ${{ secrets.CASTELLO_DREAMHOST_USER }}
          RAW_PATH: ${{ secrets.CASTELLO_DREAMHOST_SITE_PATH }}
        run: |
          if [ ! -d castello-world ]; then
            echo "castello-world/ does not exist on this branch; nothing to deploy."
            exit 1
          fi
          DH_USER="$(printf '%s' "$RAW_USER" | tr -d '[:space:]')"
          DH_PATH="$(printf '%s' "$RAW_PATH" | tr -d '[:space:]')"
          rsync -avz --no-perms --no-owner --no-group \
            --exclude 'README.md' \
            -e "ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes" \
            castello-world/ "$DH_USER@$DH_HOST:$DH_PATH/"
