<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bloom Study — Animated Petal Geometry</title>
<meta name="description" content="An animated bloom built from the wireframe construction: every petal a teardrop tangent to a shared hub." />
<style>*{box-sizing:border-box}html,body{margin:0;padding:0}</style>

<style>
  :root {
    --paper: #FAF8EF;
    --ink: #17170F;
    --dim: #79776A;
    --rule: #DEDBCB;
    --panel: #F3F0E2;
    --guide: #E3372B;
    --bloom: #F2E84E;

    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #100F09;
      --ink: #F2F0E3;
      --dim: #8B8878;
      --rule: #2C2A1E;
      --panel: #191710;
      --guide: #FF5B4D;
    }
  }
  :root[data-theme="dark"] {
    --paper: #100F09;
    --ink: #F2F0E3;
    --dim: #8B8878;
    --rule: #2C2A1E;
    --panel: #191710;
    --guide: #FF5B4D;
  }
  :root[data-theme="light"] {
    --paper: #FAF8EF;
    --ink: #17170F;
    --dim: #79776A;
    --rule: #DEDBCB;
    --panel: #F3F0E2;
    --guide: #E3372B;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .sheet {
    min-height: 100svh;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* ---------- masthead ---------- */

  .masthead {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.5rem 1.5rem;
    padding: 1.1rem clamp(1rem, 3vw, 2.25rem) 0.9rem;
    border-bottom: 1px solid var(--rule);
  }

  .masthead h1 {
    margin: 0;
    font-size: clamp(1.4rem, 3.4vw, 2.1rem);
    font-weight: 800;
    letter-spacing: -0.035em;
    text-transform: uppercase;
    line-height: 0.9;
  }

  .masthead h1 em {
    font-style: normal;
    color: var(--bloom);
    -webkit-text-stroke: 0.6px var(--ink);
  }

  .spec {
    margin: 0;
    font-family: var(--mono);
    font-size: 0.66rem;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .spec b { color: var(--ink); font-weight: 400; font-variant-numeric: tabular-nums; }

  .masthead .spec { margin-inline-start: auto; text-align: right; }

  /* ---------- stage ---------- */

  .stage {
    position: relative;
    min-height: 58svh;
  }

  canvas {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ---------- controls ---------- */

  .rail {
    border-top: 1px solid var(--rule);
    background: var(--panel);
  }

  .rail-inner {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
    gap: 0.85rem clamp(1rem, 2.5vw, 2rem);
    padding: 1rem clamp(1rem, 3vw, 2.25rem) 1.15rem;
  }

  .field { display: grid; gap: 0.35rem; align-content: start; }

  .field > .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.5rem;
    font-family: var(--mono);
    font-size: 0.62rem;
    letter-spacing: 0.13em;
    text-transform: uppercase;
    color: var(--dim);
  }

  .field output {
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 1rem;
    margin: 0;
    background: transparent;
    accent-color: var(--bloom);
    cursor: ew-resize;
  }

  input[type="range"]::-webkit-slider-runnable-track { height: 1px; background: var(--rule); }
  input[type="range"]::-moz-range-track { height: 1px; background: var(--rule); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px; margin-top: -6px;
    border-radius: 50%;
    background: var(--bloom);
    border: 1px solid var(--ink);
  }
  input[type="range"]::-moz-range-thumb {
    width: 13px; height: 13px;
    border: 1px solid var(--ink);
    border-radius: 50%;
    background: var(--bloom);
  }

  .seg {
    display: flex;
    border: 1px solid var(--rule);
    background: var(--paper);
  }

  .seg button {
    flex: 1;
    appearance: none;
    border: 0;
    border-inline-start: 1px solid var(--rule);
    background: transparent;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.45rem 0.35rem;
    cursor: pointer;
  }

  .seg button:first-child { border-inline-start: 0; }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--bloom); color: #17170F; }

  .toggles { display: flex; flex-wrap: wrap; align-items: center; gap: 0.55rem; }

  .chip {
    appearance: none;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--dim);
    font-family: var(--mono);
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 0.45rem 0.7rem;
    cursor: pointer;
  }

  .chip:hover { color: var(--ink); }
  .chip[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); }

  .swatch {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    border: 1px solid var(--rule);
    background: var(--paper);
    padding: 0.25rem 0.3rem 0.25rem 0.55rem;
    font-family: var(--mono);
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dim);
  }

  input[type="color"] {
    inline-size: 26px;
    block-size: 22px;
    padding: 0;
    border: 1px solid var(--rule);
    background: none;
    cursor: pointer;
  }

  :where(button, input, a):focus-visible {
    outline: 2px solid var(--guide);
    outline-offset: 2px;
  }

  @media (max-width: 640px) {
    .masthead .spec { margin-inline-start: 0; text-align: left; }
  }
</style>

<div class="sheet">
  <header class="masthead">
    <h1>Bloom&nbsp;Study&nbsp;<em>01</em></h1>
    <p class="spec">
      <b id="specPetals">8</b> petals and <b id="specSpikes">8</b> counter-cut spikes,
      every one a teardrop off the same hub · pulsing on a <b id="specMode">shared</b> phase
    </p>
  </header>

  <div class="stage" id="stage">
    <canvas id="c"></canvas>
  </div>

  <div class="rail">
    <div class="rail-inner">

      <div class="field">
        <div class="row"><label for="petals">Petals</label><output id="outPetals">8</output></div>
        <input id="petals" type="range" min="5" max="14" step="1" value="8" />
      </div>

      <div class="field">
        <div class="row"><label for="width">Petal width</label><output id="outWidth">0.34</output></div>
        <input id="width" type="range" min="0.10" max="0.52" step="0.01" value="0.34" />
      </div>

      <div class="field">
        <div class="row"><label for="hub">Hub</label><output id="outHub">0.10</output></div>
        <input id="hub" type="range" min="0.02" max="0.20" step="0.005" value="0.10" />
      </div>

      <div class="field">
        <div class="row"><label for="vary">Size variation</label><output id="outVary">0.30</output></div>
        <input id="vary" type="range" min="0" max="1" step="0.01" value="0.30" />
      </div>

      <div class="field">
        <div class="row"><label for="join">Join softness</label><output id="outJoin">0.45</output></div>
        <input id="join" type="range" min="0" max="1" step="0.01" value="0.45" />
      </div>

      <div class="field">
        <div class="row"><label for="core">Star reach</label><output id="outCore">0.80</output></div>
        <input id="core" type="range" min="0" max="0.95" step="0.01" value="0.80" />
      </div>

      <div class="field">
        <div class="row"><label for="spike">Spike width</label><output id="outSpike">0.25</output></div>
        <input id="spike" type="range" min="0.10" max="0.60" step="0.01" value="0.25" />
      </div>

      <div class="field">
        <div class="row"><label for="pulse">Pulse depth</label><output id="outPulse">0.22</output></div>
        <input id="pulse" type="range" min="0" max="0.50" step="0.01" value="0.22" />
      </div>

      <div class="field">
        <div class="row"><label for="speed">Speed</label><output id="outSpeed">1.00×</output></div>
        <input id="speed" type="range" min="0" max="3" step="0.05" value="1" />
      </div>

      <div class="field">
        <div class="row"><label for="spin">Spin</label><output id="outSpin">0°/s</output></div>
        <input id="spin" type="range" min="-24" max="24" step="1" value="0" />
      </div>

      <div class="field">
        <div class="row"><span>Pulse pattern</span></div>
        <div class="seg" id="modeSeg" role="group" aria-label="Pulse pattern">
          <button type="button" data-mode="breathe" aria-pressed="true">Breathe</button>
          <button type="button" data-mode="ripple" aria-pressed="false">Ripple</button>
          <button type="button" data-mode="alternate" aria-pressed="false">Alternate</button>
        </div>
      </div>

      <div class="field" style="grid-column: 1 / -1;">
        <div class="row"><span>Sheet</span></div>
        <div class="toggles">
          <div class="seg" id="viewSeg" role="group" aria-label="Layout" style="max-width: 220px;">
            <button type="button" data-view="trio" aria-pressed="true">Trio</button>
            <button type="button" data-view="single" aria-pressed="false">Single</button>
          </div>
          <button type="button" class="chip" id="guidesBtn" aria-pressed="false">Wireframe</button>
          <button type="button" class="chip" id="shuffleBtn">Reshuffle sizes</button>
          <button type="button" class="chip" id="playBtn" aria-pressed="true">Pause</button>
          <label class="swatch">Ink
            <input type="color" id="hue" value="#F2E84E" aria-label="Bloom colour" />
          </label>
        </div>
      </div>

    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const TAU = Math.PI * 2;
  const canvas = document.getElementById("c");
  const stage = document.getElementById("stage");
  const ctx = canvas.getContext("2d");

  /* ------------------------------------------------------------------ *
   * The construction, straight off the wireframe:
   *
   * Every petal — outer lobe and inner spike alike — is the same primitive:
   * the convex hull of the hub circle (radius w0, at the centre) and a tip
   * circle (radius w1 at distance dt). Its flanks are the two external
   * tangents of that pair, which is where the wireframe's long chords come
   * from, and its tip is the far arc.
   *
   *   OUTER  = union of N such teardrops, tips normalised to r = 1.
   *   INNER  = union of N smaller ones, cut back out of the body.
   *
   * A petal's size is its tip circle scaled about the shared hub, so petals
   * can differ freely while all still radiating from one point — and since
   * the hub is common, neighbours always overlap and the outline never
   * breaks apart.
   *
   * Both unions are taken as a p-norm rather than a hard max, which is what
   * rounds every join into the curvy fillet instead of a sharp cusp. Low p
   * is gooey, high p is crisp.
   *
   * Everything is normalised so an unpulsed petal tip lands at r = 1.
   * ------------------------------------------------------------------ */

  const P = {
    petals: 8,
    width: 0.34,  // petal tip cap radius, as a fraction of its reach
    hub: 0.10,    // hub circle every petal is tangent to
    vary: 0.30,   // spread of per-petal sizes
    join: 0.45,   // 0 = crisp corners, 1 = fully gooey
    core: 0.80,   // how far the star tips reach, as a fraction of r = 1
    spike: 0.25,  // tip cap radius as a fraction of that reach
    pulse: 0.22,
    speed: 1,
    spin: 0,
    mode: "breathe",
    view: "trio",
    guides: false,
    seed: 3,
    hue: "#F2E84E",
  };

  const HUB = 0.6;  // hub circle radius as a fraction of the tip cap

  const PLATES = [
    { id: "squared", squircle: 4.2, extraCircles: 4, extraSpikes: 1, coreMul: 0.62, spikeMul: 0.62, phase: 0.0 },
    { id: "roundA",  squircle: 0,   extraCircles: 0, extraSpikes: 0, coreMul: 1.0,  spikeMul: 1.0,  phase: 0.85 },
    { id: "roundB",  squircle: 0,   extraCircles: 0, extraSpikes: 0, coreMul: 0.94, spikeMul: 1.02, phase: 1.7 },
  ];

  const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

  function superR(theta, exp) {
    const c = Math.abs(Math.cos(theta));
    const s = Math.abs(Math.sin(theta));
    return Math.pow(Math.pow(c, exp) + Math.pow(s, exp), -1 / exp);
  }

  // Deterministic per-petal size, so a given seed always draws the same bloom.
  function hash01(k, seed) {
    const x = Math.sin((k + 1) * 12.9898 + seed * 78.233) * 43758.5453;
    return x - Math.floor(x);
  }

  function build(plate, t) {
    const base = Math.max(3, Math.round(P.petals));
    const n = base + plate.extraCircles;
    const cn = Math.max(3, base + plate.extraSpikes);
    const wave =
      P.mode === "ripple" ? TAU / n :
      P.mode === "alternate" ? Math.PI : 0;

    // outer teardrop: tip cap w1, seated so the tip lands at r = 1
    const oW1 = P.width;
    const oW0 = Math.min(P.hub, oW1 * 0.85);

    const reach = P.core * plate.coreMul;
    const w1 = reach * P.spike * plate.spikeMul;

    const sizes = [];
    for (let k = 0; k < Math.max(n, cn); k++) {
      const jitter = (hash01(k, P.seed) * 2 - 1) * 0.5 * P.vary;
      sizes.push(clamp(1 + jitter, 0.3, 1.6));
    }

    return {
      n, cn, sizes,
      p: 2 + Math.pow(1 - P.join, 2.2) * 40,   // p-norm exponent
      amp: P.pulse,
      rate: 1.15 * P.speed,
      wave,
      phase: plate.phase,
      corePhase: plate.phase + Math.PI,        // star closes as petals swell
      rot: ((P.spin * Math.PI) / 180) * t,
      exp: plate.squircle,
      od: 1 - oW1, oW1, oW0,
      dt: reach - w1, w1, w0: w1 * HUB,
    };
  }

  const beat = (g, k, t, phase) => Math.sin(t * g.rate + k * g.wave + phase);

  // Per-petal scale: size variation × squircle envelope × the pulse.
  function petalScale(g, k, t) {
    const loc = g.exp ? superR((k * TAU) / g.n, g.exp) : 1;
    return g.sizes[k] * loc * (1 + g.amp * beat(g, k, t, g.phase));
  }

  function spikeScale(g, k, t) {
    return g.sizes[k] * (1 + g.amp * 0.75 * beat(g, k, t, g.corePhase));
  }

  /* ---------- polar radius of each primitive ---------- */

  // Convex hull of the hub circle (w0, at the origin) and a tip circle
  // (w1 at distance L): the tip arc where the ray reaches it, otherwise the
  // external tangent flank, and the hub arc behind the shoulders.
  function capsuleRay(delta, L, w0, w1) {
    if (L <= Math.abs(w1 - w0) + 1e-9) return Math.max(w0, L + w1);
    const tt = Math.acos(clamp((w0 - w1) / L, -1, 1));
    const a = Math.abs(delta);
    if (a >= tt) return w0;

    let r = Infinity;
    const s = L * Math.sin(delta);
    const disc = w1 * w1 - s * s;
    if (disc > 0) {
      const hit = L * Math.cos(delta) + Math.sqrt(disc);
      if (hit > 0) r = hit;
    }
    for (const sign of [1, -1]) {
      const c = Math.cos(delta - sign * tt);
      if (c > 1e-6) r = Math.min(r, w0 / c);
    }
    return Number.isFinite(r) ? r : w0;
  }

  const wrap = (a) => {
    let x = a % TAU;
    if (x > Math.PI) x -= TAU;
    if (x < -Math.PI) x += TAU;
    return x;
  };

  /* ---------- soft union ---------- */

  function outerRadius(theta, g, t) {
    let acc = 0;
    for (let k = 0; k < g.n; k++) {
      const s = petalScale(g, k, t);
      const r = capsuleRay(
        wrap(theta - g.rot - (k * TAU) / g.n),
        g.od * s, g.oW0, g.oW1 * s
      );
      if (r > 0) acc += Math.pow(r, g.p);
    }
    return acc > 0 ? Math.pow(acc, 1 / g.p) : 0;
  }

  function innerRadius(theta, g, t) {
    let acc = 0;
    for (let k = 0; k < g.cn; k++) {
      const s = spikeScale(g, k, t);
      const r = capsuleRay(
        wrap(theta + g.rot * 0.55 - (k * TAU) / g.cn),
        g.dt * s, g.w0, g.w1 * s
      );
      if (r > 0) acc += Math.pow(r, g.p);
    }
    return acc > 0 ? Math.pow(acc, 1 / g.p) : 0;
  }

  // Analytic worst case, so the pulse reads as growth instead of being
  // normalised away by a per-frame refit.
  function extentOf(g) {
    const corner = g.exp ? Math.pow(2, 1 / g.exp) : 1;
    let biggest = 0;
    for (let k = 0; k < g.n; k++) biggest = Math.max(biggest, g.sizes[k]);
    const inflate = Math.pow(1 + 2 * Math.pow(0.9, g.p), 1 / g.p);
    return biggest * corner * (1 + g.amp) * inflate;
  }

  /* ---------- drawing ---------- */

  function tracePolar(path, cx, cy, S, steps, fn) {
    for (let i = 0; i <= steps; i++) {
      const th = (i / steps) * TAU;
      const r = fn(th) * S;
      const x = cx + r * Math.cos(th);
      const y = cy + r * Math.sin(th);
      if (i === 0) path.moveTo(x, y);
      else path.lineTo(x, y);
    }
    path.closePath();
  }

  function drawPlate(cx, cy, radius, plate, t) {
    const g = build(plate, t);
    const S = (radius * 0.98) / extentOf(g);

    // one sample every ~third of a pixel of arc, within reason
    const steps = Math.round(clamp(radius * 3, 420, 1400));

    const path = new Path2D();
    tracePolar(path, cx, cy, S, steps, (th) => outerRadius(th, g, t));
    if (g.w1 > 0.0008) {
      tracePolar(path, cx, cy, S, steps, (th) => innerRadius(th, g, t));
    }
    ctx.fillStyle = P.hue;
    ctx.fill(path, "evenodd");

    if (P.guides) drawWireframe(cx, cy, S, g, t);
  }

  // Convex hull of two circles, as a stroked outline for the overlay.
  function capsuleOutline(path, x0, y0, r0, x1, y1, r1) {
    const dx = x1 - x0, dy = y1 - y0;
    const L = Math.hypot(dx, dy);
    if (L < 1e-6 || L <= Math.abs(r1 - r0)) return;
    const phi = Math.atan2(dy, dx);
    const tt = Math.acos(clamp((r0 - r1) / L, -1, 1));
    path.moveTo(x1 + r1 * Math.cos(phi - tt), y1 + r1 * Math.sin(phi - tt));
    path.arc(x1, y1, r1, phi - tt, phi + tt, false);
    path.arc(x0, y0, r0, phi + tt, phi - tt + TAU, false);
    path.closePath();
  }

  // One teardrop: its outline, plus the two external tangents run out to the
  // bounding circle — the long chords that cross the reference wireframe.
  function drawTeardrop(cx, cy, a, L, w0, w1, R) {
    const px = cx + L * Math.cos(a), py = cy + L * Math.sin(a);

    const cap = new Path2D();
    capsuleOutline(cap, cx, cy, w0, px, py, w1);
    ctx.stroke(cap);

    if (L <= Math.abs(w1 - w0)) return;
    const tt = Math.acos(clamp((w0 - w1) / L, -1, 1));
    for (const sign of [1, -1]) {
      const ang = a + sign * tt;
      const t0x = cx + w0 * Math.cos(ang), t0y = cy + w0 * Math.sin(ang);
      const t1x = px + w1 * Math.cos(ang), t1y = py + w1 * Math.sin(ang);
      const len = Math.hypot(t1x - t0x, t1y - t0y) || 1;
      const nx = (t1x - t0x) / len, ny = (t1y - t0y) / len;
      const ox = t0x - cx, oy = t0y - cy;
      const b = ox * nx + oy * ny;
      const disc = b * b - (ox * ox + oy * oy - R * R);
      if (disc <= 0) continue;
      const rt = Math.sqrt(disc);
      ctx.beginPath();
      ctx.moveTo(t0x + nx * (-b - rt), t0y + ny * (-b - rt));
      ctx.lineTo(t0x + nx * (-b + rt), t0y + ny * (-b + rt));
      ctx.stroke();
    }
  }

  function drawWireframe(cx, cy, S, g, t) {
    const ink = getComputedStyle(document.documentElement)
      .getPropertyValue("--ink").trim() || "#17170F";
    const R = extentOf(g) * S;

    ctx.save();
    ctx.strokeStyle = ink;
    ctx.fillStyle = ink;
    ctx.lineWidth = 1;
    ctx.globalAlpha = 0.8;

    for (let k = 0; k < g.n; k++) {
      const s = petalScale(g, k, t);
      drawTeardrop(cx, cy, g.rot + (k * TAU) / g.n,
        g.od * s * S, g.oW0 * S, g.oW1 * s * S, R);
    }

    if (g.w1 > 0.0008) {
      for (let k = 0; k < g.cn; k++) {
        const s = spikeScale(g, k, t);
        drawTeardrop(cx, cy, -g.rot * 0.55 + (k * TAU) / g.cn,
          g.dt * s * S, g.w0 * S, g.w1 * s * S, R);
      }
    }

    // the hub every petal is tangent to, and the centre mark
    ctx.beginPath();
    ctx.arc(cx, cy, g.oW0 * S, 0, TAU);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy, 1.6, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

  /* ---------- layout ---------- */

  let W = 0, H = 0;

  function layout() {
    if (P.view === "single") {
      return [{ plate: PLATES[1], cx: W / 2, cy: H / 2, r: (Math.min(W, H) / 2) * 0.94 }];
    }
    // The reference sheet: squared plate top-left, two round plates below.
    if (W > H * 1.05) {
      const cw = W / 2, ch = H / 2;
      const r = (Math.min(cw, ch) / 2) * 0.97;
      return [
        { plate: PLATES[0], cx: cw * 0.5, cy: ch * 0.5, r },
        { plate: PLATES[1], cx: cw * 0.5, cy: ch * 1.5, r },
        { plate: PLATES[2], cx: cw * 1.5, cy: ch * 1.5, r },
      ];
    }
    const ch = H / 3;
    const r = Math.min(W / 2, ch / 2) * 0.9;
    return PLATES.map((plate, i) => ({ plate, cx: W / 2, cy: ch * (i + 0.5), r }));
  }

  /* ---------- loop ---------- */

  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");
  let playing = !reduced.matches;
  let clock = 0;
  let last = null;
  let dirty = true;

  function frame(now) {
    if (last === null) last = now;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (playing) { clock += dt; dirty = true; }

    if (dirty) {
      ctx.clearRect(0, 0, W, H);
      for (const cell of layout()) drawPlate(cell.cx, cell.cy, cell.r, cell.plate, clock);
      dirty = playing;
    }
    requestAnimationFrame(frame);
  }

  function resize() {
    const rect = stage.getBoundingClientRect();
    const dpr = Math.min(2.5, window.devicePixelRatio || 1);
    W = Math.max(1, Math.round(rect.width));
    H = Math.max(1, Math.round(rect.height));
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dirty = true;
  }

  new ResizeObserver(resize).observe(stage);
  resize();
  requestAnimationFrame(frame);

  /* ---------- wiring ---------- */

  const $ = (id) => document.getElementById(id);
  const fmt2 = (v) => Number(v).toFixed(2);

  const SLIDERS = [
    ["petals", "outPetals", (v) => String(Math.round(v))],
    ["width", "outWidth", fmt2],
    ["hub", "outHub", (v) => Number(v).toFixed(3)],
    ["vary", "outVary", fmt2],
    ["join", "outJoin", fmt2],
    ["core", "outCore", fmt2],
    ["spike", "outSpike", fmt2],
    ["pulse", "outPulse", fmt2],
    ["speed", "outSpeed", (v) => Number(v).toFixed(2) + "×"],
    ["spin", "outSpin", (v) => Math.round(v) + "°/s"],
  ];

  for (const [key, out, fmt] of SLIDERS) {
    const el = $(key);
    el.addEventListener("input", () => {
      P[key] = parseFloat(el.value);
      $(out).textContent = fmt(el.value);
      if (key === "petals") {
        const n = String(Math.round(P.petals));
        $("specPetals").textContent = n;
        $("specSpikes").textContent = n;
      }
      dirty = true;
    });
  }

  function segment(id, key, after) {
    $(id).addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      for (const b of e.currentTarget.querySelectorAll("button")) {
        b.setAttribute("aria-pressed", String(b === btn));
      }
      P[key] = btn.dataset[key];
      if (after) after();
      dirty = true;
    });
  }

  const MODE_LABEL = { breathe: "shared", ripple: "travelling", alternate: "alternating" };
  segment("modeSeg", "mode", () => { $("specMode").textContent = MODE_LABEL[P.mode]; });
  segment("viewSeg", "view");

  $("guidesBtn").addEventListener("click", (e) => {
    P.guides = !P.guides;
    e.currentTarget.setAttribute("aria-pressed", String(P.guides));
    dirty = true;
  });

  $("shuffleBtn").addEventListener("click", () => {
    P.seed = (P.seed + 1) % 997;
    dirty = true;
  });

  const playBtn = $("playBtn");
  function syncPlay() {
    playBtn.textContent = playing ? "Pause" : "Play";
    playBtn.setAttribute("aria-pressed", String(playing));
  }
  playBtn.addEventListener("click", () => {
    playing = !playing;
    last = null;
    dirty = true;
    syncPlay();
  });
  syncPlay();

  $("hue").addEventListener("input", (e) => {
    P.hue = e.target.value;
    document.documentElement.style.setProperty("--bloom", P.hue);
    dirty = true;
  });

  new MutationObserver(() => { dirty = true; })
    .observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();
</script>

</body>
</html>
