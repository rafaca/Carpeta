<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Album Archive</title>
    <meta name="description" content="Every album cover in the collection, year by year, color-coded by genre.">

    <link rel="canonical" href="https://freqz.rafacastello.com/albums.html">

    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Frequencies">
    <meta property="og:title" content="Album Archive">
    <meta property="og:description" content="Every album cover in the collection, year by year, color-coded by genre.">
    <meta property="og:url" content="https://freqz.rafacastello.com/albums.html">
    <meta property="og:image" content="https://freqz.rafacastello.com/share-image.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Rafa Castelló">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Album Archive">
    <meta name="twitter:description" content="Every album cover in the collection, year by year, color-coded by genre.">
    <meta name="twitter:image" content="https://freqz.rafacastello.com/share-image.jpg">
    <meta name="twitter:image:alt" content="Rafa Castelló">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=EB+Garamond:wght@400;500&family=Pinyon+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared/site-chrome.css">
    <link rel="stylesheet" href="albums.css">
</head>
<body>
    <header class="site-header">
        <div class="top-bar">
            <span class="top-bar__issue">20260504 / Vol·20</span>
            <div class="top-bar__links">
                <a href="#subscribe" class="top-bar__link">SUBSCRIBE</a>
                <a href="#rss" class="top-bar__link">RSS</a>
            </div>
        </div>
        <div class="brand">
            <a href="/" class="brand__logo">Frequencies</a>
        </div>
    </header>

    <main id="archive">
        <div class="archive-bar">
            <h1 class="archive-bar__title">Album Archive</h1>
            <div class="archive-bar__meta">
                <span id="album-count"></span>
                <button id="sort-toggle" type="button" aria-pressed="false">Newest first</button>
            </div>
        </div>

        <div id="legend" class="legend" role="toolbar" aria-label="Filter by genre"></div>

        <div id="years"><!-- Year sections rendered by albums.js --></div>

        <p id="empty-state" class="hidden">No albums found. Run <code>scan-albums.py</code> to generate <code>albums.json</code>.</p>
    </main>

    <nav id="page-nav">
        <a href="index.html">← Infinite photo canvas</a>
        <a href="network.html">Creator network</a>
    </nav>

    <script src="albums.js"></script>
</body>
</html>
